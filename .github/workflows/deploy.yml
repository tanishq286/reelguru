name: Deploy to surge.sh
on:
  push:
    branches:
      - claude/reelguru-landing-redesign-xd0xky
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install surge
        run: npm install -g surge
      - name: Publish reelguru.surge.sh
        run: surge ./ reelguru.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
